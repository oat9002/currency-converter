<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR choices viewport test</title>
<style>
body { margin: 0; }
iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
.controls { position: fixed; inset: 0 0 auto; font: 12px sans-serif; background: white; padding: 4px; }
output { position: fixed; inset: auto 0 0; font: 11px sans-serif; background: white; padding: 4px; }
</style>
<iframe id="app" src="/" title="Converter choices under test"></iframe>
<div class="controls">
<label>Amounts <select id="count"><option>3</option><option selected>6</option><option>12</option></select></label>
<label>Language <select id="language"><option value="en">English</option><option value="fil">Filipino</option><option value="th">Thai</option><option value="ja">Japanese</option></select></label>
<button id="reload-styles">Reload styles</button>
</div>
<output id="status">Loading test…</output>
<script>
const frame = document.getElementById('app');
function checkLayout() {
  const app = frame.contentWindow;
  const dialog = app.document.getElementById('camera-modal');
  const panel = dialog.querySelector('.camera-panel');
  const buttons = [...app.document.querySelectorAll('#ocr-candidates button')];
  const fits = [dialog, panel].every(el => el.scrollHeight <= el.clientHeight + 1 && el.scrollWidth <= el.clientWidth + 1);
  const visible = buttons.every(el => { const rect = el.getBoundingClientRect(); return rect.top >= 0 && rect.bottom <= app.innerHeight; });
  document.getElementById('status').textContent = (fits && visible ? 'PASS' : 'FAIL') + ': ' + buttons.length + ' buttons visible; no scrolling: ' + fits + '; viewport ' + app.innerWidth + '×' + app.innerHeight;
}
function renderChoices() {
  const app = frame.contentWindow;
  const language = app.document.getElementById('language-select');
  language.value = document.getElementById('language').value;
  language.dispatchEvent(new app.Event('change'));
  const count = Number(document.getElementById('count').value);
  app.showCandidateOptions(Array.from({ length: count }, (_, index) => ({ value: (index + 1) * 125000, confidence: 70, score: 100 })));
  app.requestAnimationFrame(() => app.requestAnimationFrame(checkLayout));
}
frame.addEventListener('load', () => {
  const app = frame.contentWindow;
  Object.defineProperty(app.navigator, 'mediaDevices', { configurable: true, value: { getUserMedia: () => new Promise(() => {}) } });
  app.document.getElementById('camera-btn').click();
  renderChoices();
  app.addEventListener('resize', () => app.requestAnimationFrame(checkLayout));
});
document.getElementById('reload-styles').addEventListener('click', () => {
  const link = frame.contentDocument.createElement('link');
  link.rel = 'stylesheet';
  link.href = '/tailwind.css?fixture=' + Date.now();
  link.onload = () => frame.contentWindow.requestAnimationFrame(checkLayout);
  frame.contentDocument.head.appendChild(link);
});
document.getElementById('count').addEventListener('change', renderChoices);
document.getElementById('language').addEventListener('change', renderChoices);
</script>
</html>
